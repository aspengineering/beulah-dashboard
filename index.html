<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Beulah Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  html, body, #root { height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
  .scrollbar-thin::-webkit-scrollbar { width: 8px; height: 8px; }

<body class="bg-slate-50 text-slate-900">
<div id="root"></div>
<div id="toast" class="fixed bottom-20 left-1/2 -translate-x-1/2 hidden bg-slate-900 text-white text-sm px-4 py-2 rounded-lg shadow-lg z-50"></div>

<script>
// ─────────────────────────────────────────────────────────────────────────
// CONFIG — fill these in after creating your Supabase project.
// Settings → API → "Project URL" and "anon / public" key.
// ─────────────────────────────────────────────────────────────────────────
const SUPABASE_URL      = 'https://ajlmeavwyqksjvuutmnb.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_q6kTC_otM9TSUwT8cjZ57g_-zds04Gw';
// ─────────────────────────────────────────────────────────────────────────

const STAGES = ['Lead', 'Contacted', 'Proposal', 'Negotiating', 'Signed'];
const KIND_LABELS = { note: 'Note', email: 'Email', call: 'Call', meeting: 'Meeting' };
const STALE_DAYS = 3;

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const state = {
  user: null,
  leads: [],
  selectedId: null,
  activity: [],
  todos: [],
  filter: 'all',
  sort: 'updated',
  editingHeader: false,
  allActivity: [],
  allTodos: [],
  masterTodos: [],
  contactMap: {}
};

// ─── Utilities ───────────────────────────────────────────────────────────
const $ = (sel) => document.querySelector(sel);
const root = () => $('#root');
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function stageIndex(stage) { return Math.max(0, STAGES.indexOf(stage)); }
function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function nowLocal() {
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 16);
}
function fmtDue(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  const ms = d.getTime() - Date.now();
  const days = Math.round(ms / 86400000);
  let text;
  if (days < 0) text = `${Math.abs(days)}d overdue`;
  else if (days === 0) text = 'due today';
  else if (days === 1) text = 'due tomorrow';
  else if (days < 14) text = `due in ${days}d`;
  else text = 'due ' + d.toLocaleDateString(undefined, { month:'short', day:'numeric' });
  return { text, overdue: ms < 0, soon: ms >= 0 && days <= 1 };
}
function fmtRelative(iso) {
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
  if (diff < 604800) return Math.floor(diff/86400) + 'd ago';
  return new Date(iso).toLocaleDateString();
}
function inferKind(body) {
  const b = body.toLowerCase();
  if (/\b(email|sent|forward|replied|inbox|reply)\b/.test(b)) return 'email';
  if (/\b(call|phone|rang|dialed|voicemail|vm)\b/.test(b)) return 'call';
  if (/\b(meet|meeting|demo|zoom|gmeet|teams|coffee|lunch)\b/.test(b)) return 'meeting';
  return 'note';
}
function toast(msg, isError = false) {
  const el = $('#toast');
  el.textContent = msg;
  el.className = `fixed bottom-20 left-1/2 -translate-x-1/2 text-sm px-4 py-2 rounded-lg shadow-lg z-50 ${isError ? 'bg-red-600' : 'bg-slate-900'} text-white`;
  el.classList.remove('hidden');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.add('hidden'), 2200);
}

// ─── Init ────────────────────────────────────────────────────────────────
async function init() {
  if (SUPABASE_URL.startsWith('YOUR_') || SUPABASE_ANON_KEY.startsWith('YOUR_')) {
    renderConfigError();
    return;
  }
  const { data: { session } } = await sb.auth.getSession();
  state.user = session?.user || null;
  state.user ? await renderApp() : renderLogin();
  sb.auth.onAuthStateChange(async (_e, sess) => {
    state.user = sess?.user || null;
    state.user ? await renderApp() : renderLogin();
  });
}

function renderConfigError() {
  root().innerHTML = `
    <div class="h-full flex items-center justify-center p-8">
      <div class="max-w-lg bg-white border border-amber-300 rounded-xl p-6 shadow-sm">
        <h1 class="text-xl font-semibold text-amber-800 mb-2">Setup needed</h1>
        <p class="text-slate-700 mb-3">Open <code class="bg-slate-100 px-1.5 py-0.5 rounded">index.html</code> in a text editor and replace these two values near the top:</p>
        <pre class="bg-slate-100 text-xs p-3 rounded overflow-auto"><code>const SUPABASE_URL      = 'YOUR_SUPABASE_URL';
const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';</code></pre>
        <p class="text-slate-600 text-sm mt-3">See <code class="bg-slate-100 px-1 rounded">README.md</code> for the full setup.</p>
      </div>
    </div>`;
}

// ─── Login screen ────────────────────────────────────────────────────────
function renderLogin() {
  root().innerHTML = `
    <div class="h-full flex items-center justify-center bg-gradient-to-br from-slate-50 to-slate-100 p-6">
      <form id="login-form" class="w-full max-w-sm bg-white p-8 rounded-2xl shadow-sm border border-slate-200 fade-in">
        <h1 class="text-2xl font-bold text-slate-900 mb-1">Beulah</h1>
        <p class="text-sm text-slate-500 mb-6">Sales tracking dashboard</p>
        <label class="block text-xs font-medium text-slate-700 mb-1">Email</label>
        <input id="login-email" type="email" required autocomplete="email"
          class="w-full px-3 py-2 mb-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-transparent text-sm" />
        <label class="block text-xs font-medium text-slate-700 mb-1">Password</label>
        <input id="login-password" type="password" required autocomplete="current-password"
          class="w-full px-3 py-2 mb-4 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-transparent text-sm" />
        <button type="submit" class="w-full bg-slate-900 text-white py-2 rounded-lg text-sm font-medium hover:bg-slate-800 transition">Sign in</button>
        <p id="login-error" class="text-red-600 text-xs mt-3 hidden"></p>
      </form>
    </div>`;
  $('#login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = $('#login-email').value;
    const password = $('#login-password').value;
    const btn = e.target.querySelector('button');
    btn.disabled = true; btn.textContent = 'Signing in…';
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      $('#login-error').textContent = error.message;
      $('#login-error').classList.remove('hidden');
      btn.disabled = false; btn.textContent = 'Sign in';
    }
  });
}

// ─── App shell ───────────────────────────────────────────────────────────
async function renderApp() {
  root().innerHTML = `
    <div class="h-full flex flex-col">
      <header class="h-14 flex items-center justify-between px-6 border-b border-slate-200 bg-white shrink-0">
        <button data-action="go-home" class="flex items-center gap-3 hover:opacity-80 transition" title="Overview">
          <span class="text-xl font-bold">Beulah</span>
          <span class="text-xs text-slate-400 hidden sm:inline">Sales dashboard</span>
        </button>
        <div class="flex items-center gap-2 text-sm">
          <button data-action="go-home" class="text-slate-700 hover:text-slate-900 text-xs px-2.5 py-1.5 border border-slate-300 rounded-md hover:bg-slate-50">Overview</button>
          <span class="text-slate-600 hidden sm:inline text-xs">${esc(state.user.email)}</span>
          <button data-action="logout" class="text-slate-600 hover:text-slate-900 text-xs px-2.5 py-1.5 border border-slate-300 rounded-md hover:bg-slate-50">Sign out</button>
        </div>
      </header>
      <div class="flex-1 flex overflow-hidden">
        <aside id="sidebar" class="w-72 border-r border-slate-200 bg-white flex flex-col shrink-0"></aside>
        <main id="main" class="flex-1 overflow-y-auto scrollbar-thin"></main>
      </div>
      <footer class="border-t border-slate-200 bg-white shrink-0 px-3 py-2 flex items-center gap-2">
        <form id="log-form" class="flex-1 flex items-center gap-2 flex-wrap sm:flex-nowrap">
          <input id="log-input" type="text" placeholder="Type or dictate… e.g. 'spoke with Duncan at MotorEasy, demo went well' — auto-routes to the right lead"
            class="flex-1 min-w-0 px-3 py-2 bg-slate-100 border border-transparent focus:bg-white focus:border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-900" />
          <button type="button" id="log-mic" data-action="mic-toggle" title="Voice dictation"
            class="px-3 py-2 border border-slate-300 rounded-md hover:bg-slate-50 text-sm font-semibold shrink-0">Mic</button>
          <input id="log-when" type="datetime-local"
            class="text-xs px-2 py-2 border border-slate-200 rounded-md bg-white" title="When did/will this happen? Past = logged. Future = upcoming." />
          <button type="submit" class="px-4 py-2 bg-slate-900 text-white text-sm font-medium rounded-lg hover:bg-slate-800 transition shrink-0">Log</button>
        </form>
      </footer>
    </div>`;

  // Global event delegation
  document.body.addEventListener('click', onClick);
  $('#log-form').addEventListener('submit', onLogSubmit);
  $('#log-when').value = nowLocal();

  await loadLeadsAndActivity();
  renderSidebar();
  renderMain();
}

function computeLastEventCache() {
  state.lastEventByLead = {};
  const now = Date.now();
  for (const a of state.allActivity) {
    const t = new Date(a.event_at).getTime();
    if (t > now) continue;
    const cur = state.lastEventByLead[a.lead_id];
    if (!cur || new Date(cur) < new Date(a.event_at)) state.lastEventByLead[a.lead_id] = a.event_at;
  }
}
function leadLastTouched(lead) {
  return state.lastEventByLead?.[lead.id] || lead.created_at;
}

async function loadLeadsAndActivity() {
  const [leadsRes, actRes, todosRes, masterRes] = await Promise.all([
    sb.from('leads').select('*').order('updated_at', { ascending: false }),
    sb.from('activity_log').select('id, lead_id, kind, body, event_at, created_at').order('event_at', { ascending: false }).limit(2000),
    sb.from('todos').select('*').eq('done', false).not('lead_id', 'is', null).order('created_at', { ascending: true }).limit(500),
    sb.from('todos').select('*').is('lead_id', null).order('created_at', { ascending: true })
  ]);
  if (leadsRes.error) toast(leadsRes.error.message, true);
  state.leads = leadsRes.data || [];
  state.allActivity = actRes.data || [];
  state.allTodos = todosRes.data || [];
  state.masterTodos = masterRes.data || [];
  computeLastEventCache();
  buildContactMap();
}

// Build a map of "first-name" → lead_id by parsing "Kontakt: <Name>" out of notes.
// Used by the smart log bar for auto-routing.
function buildContactMap() {
  state.contactMap = {};
  for (const l of state.leads) {
    const txt = (l.notes || '');
    // Hungarian form: "Kontakt: Duncan (CEO)." or "Kontakt: Nic."
    const matches = txt.matchAll(/Kontakt[:\s]+([A-ZÁÉÍÓÖŐÚÜŰ][\wÀ-ſ]+)/g);
    for (const m of matches) state.contactMap[m[1].toLowerCase()] = l.id;
  }
}

// ─── Data loading ────────────────────────────────────────────────────────
async function loadLeadDetail(id) {
  const [a, t] = await Promise.all([
    sb.from('activity_log').select('*').eq('lead_id', id).order('event_at', { ascending: false }),
    sb.from('todos').select('*').eq('lead_id', id).order('created_at', { ascending: true })
  ]);
  state.activity = a.data || [];
  state.todos = t.data || [];
}

// ─── Sidebar ─────────────────────────────────────────────────────────────
function renderSidebar() {
  const filtered = state.leads.filter(l => state.filter === 'all' || l.stage === state.filter);
  const sorted = [...filtered].sort((a, b) => {
    if (state.sort === 'name') return a.name.localeCompare(b.name);
    if (state.sort === 'stage') return stageIndex(b.stage) - stageIndex(a.stage);
    return new Date(leadLastTouched(b)) - new Date(leadLastTouched(a));
  });

  $('#sidebar').innerHTML = `
    <div class="p-3 border-b border-slate-200 space-y-2">
      <button data-action="add-lead" class="w-full bg-slate-900 text-white py-2 rounded-lg text-sm font-medium hover:bg-slate-800 transition">+ New lead</button>
      <div class="flex gap-2">
        <select data-action="set-filter" class="flex-1 text-xs border border-slate-300 rounded-md px-2 py-1.5 bg-white focus:outline-none focus:ring-1 focus:ring-slate-900">
          <option value="all" ${state.filter==='all'?'selected':''}>All stages</option>
          ${STAGES.map(s => `<option value="${s}" ${state.filter===s?'selected':''}>${s}</option>`).join('')}
        </select>
        <select data-action="set-sort" class="flex-1 text-xs border border-slate-300 rounded-md px-2 py-1.5 bg-white focus:outline-none focus:ring-1 focus:ring-slate-900">
          <option value="updated" ${state.sort==='updated'?'selected':''}>Recent</option>
          <option value="name" ${state.sort==='name'?'selected':''}>Name</option>
          <option value="stage" ${state.sort==='stage'?'selected':''}>Stage</option>
        </select>
      </div>
      <div class="text-xs text-slate-400 px-1">${sorted.length} ${sorted.length === 1 ? 'lead' : 'leads'}</div>
    </div>
    <div class="flex-1 overflow-y-auto scrollbar-thin">
      ${sorted.length === 0
        ? `<div class="p-6 text-center text-sm text-slate-400">${state.leads.length === 0 ? 'No leads yet. Click "+ New lead" to start.' : 'No leads match this filter.'}</div>`
        : sorted.map(leadCardHTML).join('')}
    </div>`;

  $('#sidebar').querySelectorAll('select[data-action="set-filter"]')[0]
    ?.addEventListener('change', (e) => { state.filter = e.target.value; renderSidebar(); });
  $('#sidebar').querySelectorAll('select[data-action="set-sort"]')[0]
    ?.addEventListener('change', (e) => { state.sort = e.target.value; renderSidebar(); });
}

function leadCardHTML(lead) {
  const idx = stageIndex(lead.stage);
  const isSel = lead.id === state.selectedId;
  const segments = STAGES.map((_, i) =>
    `<span class="h-1 flex-1 rounded-full ${i <= idx ? 'bg-emerald-500' : 'bg-slate-200'}"></span>`
  ).join('');
  return `
    <button data-action="select-lead" data-id="${lead.id}"
      class="w-full text-left p-3 border-b border-slate-100 transition ${isSel ? 'bg-slate-100' : 'hover:bg-slate-50'}">
      <div class="flex items-center justify-between mb-1">
        <span class="font-medium text-sm text-slate-900 truncate">${esc(lead.name)}</span>
        <span class="text-[10px] text-slate-500 shrink-0 ml-2">${fmtRelative(leadLastTouched(lead))}</span>
      </div>
      ${lead.company ? `<div class="text-xs text-slate-500 mb-2 truncate">${esc(lead.company)}</div>` : '<div class="mb-2"></div>'}
      <div class="flex items-center gap-1.5 mb-1">${segments}</div>
      <div class="text-[11px] text-slate-500">${esc(lead.stage)} · ${idx + 1}/${STAGES.length}</div>
    </button>`;
}

// ─── Main panel ──────────────────────────────────────────────────────────
function renderMain() {
  const lead = state.leads.find(l => l.id === state.selectedId);
  if (!lead) {
    $('#main').innerHTML = `<div class="p-8 text-center text-slate-400 text-sm">Loading overview…</div>`;
    renderOverview();
    return;
  }
  const idx = stageIndex(lead.stage);
  $('#main').innerHTML = `
    <div class="max-w-5xl mx-auto p-6 fade-in">
      ${headerHTML(lead)}
      ${progressHTML(lead, idx)}
      <section class="bg-amber-50 rounded-xl border-2 border-amber-300 p-5 mt-6 shadow-sm">
        <div class="flex items-center justify-between mb-3 gap-3">
          <h3 class="text-base font-bold text-slate-900">To do <span class="text-amber-700">· ${state.todos.filter(t=>!t.done).length} open</span></h3>
        </div>
        <form id="todo-form" class="flex gap-2 mb-3 flex-wrap sm:flex-nowrap">
          <input id="todo-input" type="text" placeholder="What still needs to happen for this lead to sign?"
            class="flex-1 min-w-0 px-3 py-2 text-sm border border-amber-300 rounded-md bg-white focus:outline-none focus:ring-2 focus:ring-amber-500" />
          <input id="todo-due" type="date" title="Due date (optional)"
            class="px-2 py-2 text-sm border border-amber-300 rounded-md bg-white focus:outline-none focus:ring-2 focus:ring-amber-500" />
          <button type="submit" class="px-4 py-2 bg-slate-900 text-white text-sm font-medium rounded-md hover:bg-slate-800 shrink-0">Add</button>
        </form>
        <div id="todo-list">${todosHTML()}</div>
      </section>
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mt-6">
        <section class="lg:col-span-3 bg-white rounded-xl border border-slate-200 p-5">
          <h3 class="text-sm font-semibold text-slate-900 mb-3">Activity</h3>
          <div id="activity-list">${activityHTML()}</div>
        </section>
        <section class="lg:col-span-3 bg-white rounded-xl border border-slate-200 p-5">
          <div class="flex items-center justify-between mb-2">
            <h3 class="text-sm font-semibold text-slate-900">Notes</h3>
            <span id="notes-status" class="text-[11px] text-slate-400"></span>
          </div>
          <textarea id="notes" rows="4" placeholder="Free-form notes — what does this lead need before signing?"
            class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-slate-900 bg-slate-50 focus:bg-white">${esc(lead.notes || '')}</textarea>
        </section>
      </div>
    </div>`;

  $('#todo-form').addEventListener('submit', onTodoSubmit);
  $('#notes').addEventListener('blur', onNotesBlur);
  $('#notes').addEventListener('input', () => $('#notes-status').textContent = 'unsaved…');
  if (state.editingHeader) $('#header-name')?.focus();
}

function headerHTML(lead) {
  if (state.editingHeader) {
    return `
      <form id="header-form" class="bg-white rounded-xl border border-slate-200 p-5 mb-4 grid grid-cols-1 sm:grid-cols-2 gap-3">
        <input id="header-name"    name="name"    value="${esc(lead.name)}"    placeholder="Full name"
          class="px-3 py-2 text-sm border border-slate-300 rounded-md focus:outline-none focus:ring-1 focus:ring-slate-900 sm:col-span-2 font-semibold text-base" required />
        <input id="header-company" name="company" value="${esc(lead.company || '')}" placeholder="Company"
          class="px-3 py-2 text-sm border border-slate-300 rounded-md focus:outline-none focus:ring-1 focus:ring-slate-900" />
        <input id="header-email"   name="email"   value="${esc(lead.email || '')}"   placeholder="Email" type="email"
          class="px-3 py-2 text-sm border border-slate-300 rounded-md focus:outline-none focus:ring-1 focus:ring-slate-900" />
        <input id="header-phone"   name="phone"   value="${esc(lead.phone || '')}"   placeholder="Phone"
          class="px-3 py-2 text-sm border border-slate-300 rounded-md focus:outline-none focus:ring-1 focus:ring-slate-900" />
        <div class="sm:col-span-2 flex justify-end gap-2 pt-1">
          <button type="button" data-action="cancel-edit" class="px-3 py-1.5 text-sm text-slate-600 hover:text-slate-900">Cancel</button>
          <button type="submit" class="px-3 py-1.5 bg-slate-900 text-white text-sm rounded-md hover:bg-slate-800">Save</button>
          <button type="button" data-action="delete-lead" class="px-3 py-1.5 text-sm text-red-600 hover:bg-red-50 rounded-md ml-auto">Delete lead</button>
        </div>
      </form>`;
  }
  const contact = [lead.email, lead.phone].filter(Boolean).map(esc).join(' · ');
  return `
    <div class="flex items-start justify-between mb-4 gap-3">
      <div class="min-w-0">
        <h2 class="text-2xl font-bold text-slate-900 break-words">${esc(lead.name)}</h2>
        ${lead.company ? `<div class="text-slate-600 text-sm mt-0.5 break-words">${esc(lead.company)}</div>` : ''}
        ${contact ? `<div class="text-slate-500 text-xs mt-1 break-words">${contact}</div>` : ''}
      </div>
      <button data-action="edit-header" class="px-3 py-1.5 text-sm border border-slate-300 rounded-md hover:bg-slate-50 shrink-0">Edit</button>
    </div>`;
}

function progressHTML(lead, idx) {
  const segments = STAGES.map((s, i) => {
    const filled = i <= idx;
    const isCurrent = i === idx;
    return `
      <button data-action="set-stage" data-stage="${s}"
        class="flex-1 group relative">
        <div class="h-2 rounded-full transition ${filled ? 'bg-emerald-500' : 'bg-slate-200 group-hover:bg-slate-300'}"></div>
        <div class="text-[11px] mt-1.5 ${isCurrent ? 'font-semibold text-slate-900' : 'text-slate-500'}">${s}</div>
      </button>`;
  }).join('<div class="w-1"></div>');
  const nextStage = STAGES[idx + 1];
  return `
    <div class="bg-white rounded-xl border border-slate-200 p-5">
      <div class="flex items-center justify-between mb-3 gap-3 flex-wrap">
        <span class="text-sm font-semibold text-slate-900">Pipeline progress · ${idx + 1} of ${STAGES.length}</span>
        ${nextStage
          ? `<button data-action="set-stage" data-stage="${nextStage}" class="px-3 py-1.5 bg-emerald-600 text-white text-xs font-medium rounded-md hover:bg-emerald-700 transition">Advance to ${nextStage} →</button>`
          : `<span class="px-3 py-1.5 bg-emerald-50 text-emerald-700 text-xs font-semibold rounded-md">Signed</span>`}
      </div>
      <div class="flex items-start">${segments}</div>
      <div class="text-[11px] text-slate-400 mt-2">Tap any stage to jump there.</div>
    </div>`;
}

function activityHTML() {
  if (state.activity.length === 0) {
    return `<div class="text-sm text-slate-400 py-4">No activity yet. Use the bar at the bottom to log progress — past or future.</div>`;
  }
  const now = Date.now();
  const upcoming = state.activity
    .filter(a => new Date(a.event_at).getTime() > now)
    .sort((a, b) => new Date(a.event_at) - new Date(b.event_at));
  const past = state.activity
    .filter(a => new Date(a.event_at).getTime() <= now)
    .sort((a, b) => new Date(b.event_at) - new Date(a.event_at));
  let html = '';
  if (upcoming.length) {
    html += `<div class="text-[11px] font-semibold uppercase tracking-wide text-blue-600 mb-2 mt-1">Upcoming · ${upcoming.length}</div>`;
    html += upcoming.map(a => activityItemHTML(a, true)).join('');
  }
  if (past.length) {
    if (upcoming.length) html += `<div class="text-[11px] font-semibold uppercase tracking-wide text-slate-500 mt-5 mb-2">Past</div>`;
    html += past.map(a => activityItemHTML(a, false)).join('');
  }
  return html;
}

function activityItemHTML(a, isFuture) {
  return `
    <div class="flex gap-3 py-2.5 border-b border-slate-100 last:border-0 fade-in group ${isFuture ? 'bg-blue-50/40 -mx-2 px-2 rounded-md' : ''}">
      <span class="text-[10px] uppercase tracking-wide font-semibold text-slate-500 bg-slate-100 px-1.5 py-0.5 rounded shrink-0 mt-0.5 h-5">${KIND_LABELS[a.kind] || 'Note'}</span>
      <div class="flex-1 min-w-0">
        <div class="text-sm ${isFuture ? 'text-slate-800' : 'text-slate-900'} break-words">${esc(a.body)}</div>
        <div class="text-[11px] ${isFuture ? 'text-blue-600 font-medium' : 'text-slate-400'} mt-0.5">${fmtDate(a.event_at)}</div>
      </div>
      <button data-action="delete-activity" data-id="${a.id}" class="text-slate-300 hover:text-red-600 text-xs px-1" title="Delete">×</button>
    </div>`;
}

function dueBadgeHTML(t, big = false) {
  const due = fmtDue(t.due_at);
  if (!due) return '';
  if (due.overdue) {
    return `<span class="${big ? 'text-base font-extrabold' : 'text-xs font-bold'} text-red-600 ml-2 whitespace-nowrap">${due.text.toUpperCase()}</span>`;
  }
  if (due.soon) {
    return `<span class="text-xs font-semibold text-amber-700 ml-2 whitespace-nowrap">${due.text}</span>`;
  }
  return `<span class="text-xs text-slate-500 ml-2 whitespace-nowrap">${due.text}</span>`;
}

function todosHTML() {
  if (state.todos.length === 0) {
    return `<div class="text-sm text-slate-500 py-2">Nothing to do yet. Add the next concrete step above.</div>`;
  }
  const open = state.todos.filter(t => !t.done);
  const done = state.todos.filter(t => t.done);
  const row = (t) => {
    const due = fmtDue(t.due_at);
    const overdue = !t.done && due?.overdue;
    return `
    <label class="flex items-start gap-2 py-2 group cursor-pointer ${overdue ? 'bg-red-50 -mx-2 px-2 rounded-md border-l-4 border-red-500' : ''}">
      <input type="checkbox" data-action="toggle-todo" data-id="${t.id}" ${t.done ? 'checked' : ''}
        class="mt-0.5 w-4 h-4 rounded border-amber-400 text-emerald-600 focus:ring-emerald-500" />
      <span class="flex-1 text-sm font-medium ${t.done ? 'line-through text-slate-400' : 'text-slate-900'} break-words">
        ${esc(t.body)}${dueBadgeHTML(t, overdue)}
      </span>
      <button data-action="delete-todo" data-id="${t.id}" class="text-slate-400 hover:text-red-600 text-xs opacity-0 group-hover:opacity-100">×</button>
    </label>`;
  };
  let html = open.map(row).join('');
  if (done.length) html += `<div class="text-[10px] uppercase tracking-wide text-slate-400 mt-3 mb-1">Done · ${done.length}</div>` + done.map(row).join('');
  return html;
}

function masterTodosHTML() {
  const open = (state.masterTodos || []).filter(t => !t.done);
  const done = (state.masterTodos || []).filter(t => t.done);
  const overdueCount = open.filter(t => fmtDue(t.due_at)?.overdue).length;
  const row = (t) => {
    const due = fmtDue(t.due_at);
    const overdue = !t.done && due?.overdue;
    return `
    <label class="flex items-start gap-2 py-2 group cursor-pointer ${overdue ? 'bg-red-50 -mx-2 px-2 rounded-md border-l-4 border-red-500' : ''}">
      <input type="checkbox" data-action="toggle-master-todo" data-id="${t.id}" ${t.done ? 'checked' : ''}
        class="mt-0.5 w-4 h-4 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500" />
      <span class="flex-1 text-sm font-medium ${t.done ? 'line-through text-slate-400' : 'text-slate-900'} break-words">
        ${esc(t.body)}${dueBadgeHTML(t, overdue)}
      </span>
      <button data-action="delete-master-todo" data-id="${t.id}" class="text-slate-300 hover:text-red-600 text-xs opacity-0 group-hover:opacity-100">×</button>
    </label>`;
  };
  return `
    <section class="bg-white rounded-xl border border-slate-200 p-5 mb-5">
      <div class="flex items-center justify-between mb-3 gap-3 flex-wrap">
        <h3 class="text-base font-semibold text-slate-900">Master tasks</h3>
        <span class="text-xs ${overdueCount > 0 ? 'text-red-600 font-bold' : 'text-slate-500'}">${overdueCount > 0 ? overdueCount + ' overdue · ' : ''}${open.length} open${done.length ? ` · ${done.length} done` : ''}</span>
      </div>
      <form id="master-todo-form" class="flex gap-2 mb-3 flex-wrap sm:flex-nowrap">
        <input id="master-todo-input" type="text" placeholder="e.g. Call each lead — follow-up call (not email)"
          class="flex-1 min-w-0 px-3 py-2 text-sm border border-slate-300 rounded-md focus:outline-none focus:ring-1 focus:ring-slate-900" />
        <input id="master-todo-due" type="date" title="Due date (optional)"
          class="px-2 py-2 text-sm border border-slate-300 rounded-md focus:outline-none focus:ring-1 focus:ring-slate-900" />
        <button type="submit" class="px-4 py-2 bg-slate-900 text-white text-sm font-medium rounded-md hover:bg-slate-800 shrink-0">Add</button>
      </form>
      ${state.masterTodos.length === 0
        ? `<div class="text-xs text-slate-400 py-2">No master tasks yet.</div>`
        : open.map(row).join('') + (done.length ? `<div class="text-[10px] uppercase tracking-wide text-slate-400 mt-3 mb-1">Done · ${done.length}</div>` + done.map(row).join('') : '')}
    </section>`;
}

// ─── Overview (step-back dashboard) ──────────────────────────────────────
async function renderOverview() {
  await loadLeadsAndActivity();

  const now = Date.now();
  const total = state.leads.length;
  const signed = state.leads.filter(l => l.stage === 'Signed').length;
  const active = total - signed;
  const staleMs = STALE_DAYS * 86400000;

  // Activity counts (last 14 days, past only) for "hot" ranking
  const fortnightAgo = now - 14 * 86400000;
  const recentCounts = {};
  state.allActivity.forEach(a => {
    const t = new Date(a.event_at).getTime();
    if (t > fortnightAgo && t <= now) recentCounts[a.lead_id] = (recentCounts[a.lead_id] || 0) + 1;
  });

  // Open todo counts per lead
  const todoCounts = {};
  state.allTodos.forEach(t => { todoCounts[t.lead_id] = (todoCounts[t.lead_id] || 0) + 1; });

  // Upcoming events per lead (future)
  const upcoming = state.allActivity.filter(a => new Date(a.event_at).getTime() > now)
    .sort((a, b) => new Date(a.event_at) - new Date(b.event_at));
  const upcomingByLead = {};
  upcoming.forEach(a => { upcomingByLead[a.lead_id] = (upcomingByLead[a.lead_id] || 0) + 1; });

  // Pipeline distribution
  const dist = {};
  STAGES.forEach(s => dist[s] = 0);
  state.leads.forEach(l => { dist[l.stage] = (dist[l.stage] || 0) + 1; });
  const maxStage = Math.max(1, ...Object.values(dist));

  // Decorate every lead with computed fields
  const decorated = state.leads.map(l => ({
    ...l,
    lastTouched: leadLastTouched(l),
    count14d: recentCounts[l.id] || 0,
    openTodos: todoCounts[l.id] || 0,
    upcomingCount: upcomingByLead[l.id] || 0
  }));

  // Excluded from "Hottest" and "Needs attention" — early test rows
  const EXCLUDE = new Set(['sípos lóránt', 'vidák lászló']);
  const isExcluded = (l) => EXCLUDE.has((l.name || '').toLowerCase());

  // Hottest: only leads with at least one log in the last 14 days
  const hottest = decorated
    .filter(l => l.stage !== 'Signed' && !isExcluded(l) && l.count14d > 0)
    .sort((a, b) => (b.count14d - a.count14d) || (new Date(b.lastTouched) - new Date(a.lastTouched)))
    .slice(0, 8);

  // Needs attention: stale OR no scheduled future event (merged section)
  const needsAttention = decorated
    .filter(l => {
      if (l.stage === 'Signed' || isExcluded(l)) return false;
      const isStale = (now - new Date(l.lastTouched).getTime()) > staleMs;
      const noNextStep = l.upcomingCount === 0;
      return isStale || noNextStep;
    })
    .sort((a, b) => new Date(a.lastTouched) - new Date(b.lastTouched))
    .slice(0, 16);

  // Recent wins: leads signed in the last 30 days
  const monthAgo = now - 30 * 86400000;
  const recentWins = decorated
    .filter(l => l.stage === 'Signed' && new Date(l.updated_at).getTime() > monthAgo)
    .sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at))
    .slice(0, 5);

  // Recent activity feed (last 12 past entries across all leads)
  const recentActivity = state.allActivity
    .filter(a => new Date(a.event_at).getTime() <= now)
    .sort((a, b) => new Date(b.event_at) - new Date(a.event_at))
    .slice(0, 12);

  // 14-day sparkline
  const days = [];
  for (let i = 13; i >= 0; i--) {
    const dayStart = new Date(); dayStart.setHours(0,0,0,0); dayStart.setDate(dayStart.getDate() - i);
    const dayEnd = new Date(dayStart); dayEnd.setDate(dayEnd.getDate() + 1);
    const c = state.allActivity.filter(a => {
      const t = new Date(a.event_at).getTime();
      return t >= dayStart.getTime() && t < dayEnd.getTime();
    }).length;
    days.push({ date: dayStart, count: c });
  }
  const sparkMax = Math.max(1, ...days.map(d => d.count));
  const totalLogs = days.reduce((s, d) => s + d.count, 0);

  // Todos grouped by lead
  const todosByLead = {};
  state.allTodos.forEach(t => {
    (todosByLead[t.lead_id] = todosByLead[t.lead_id] || []).push(t);
  });

  $('#main').innerHTML = `
    <div class="max-w-7xl mx-auto p-4 sm:p-6 fade-in">
      <div class="flex items-baseline justify-between mb-5 gap-3 flex-wrap">
        <div>
          <h2 class="text-2xl font-bold text-slate-900">Overview</h2>
          <p class="text-sm text-slate-500">Everything across all leads, at a glance</p>
        </div>
        <span class="text-xs text-slate-400">Updated ${new Date().toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'})}</span>
      </div>

      ${masterTodosHTML()}

      <div class="grid grid-cols-2 sm:grid-cols-5 gap-3 mb-5">
        ${kpiCardHTML('Total leads', total)}
        ${kpiCardHTML('Active', active)}
        ${kpiCardHTML('Signed', signed, 'emerald')}
        ${kpiCardHTML('Upcoming', upcoming.length, 'blue')}
        ${kpiCardHTML('Open todos', state.allTodos.length)}
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-5 mb-5">
        <section class="lg:col-span-2 bg-white rounded-xl border border-slate-200 p-5">
          <div class="flex items-baseline justify-between mb-4">
            <h3 class="text-sm font-semibold text-slate-900">Pipeline distribution</h3>
            <span class="text-[11px] text-slate-400">Tap a bar to filter</span>
          </div>
          <div class="space-y-2.5">
            ${STAGES.map(stage => {
              const count = dist[stage] || 0;
              const pct = (count / maxStage) * 100;
              const stagePct = total ? Math.round((count / total) * 100) : 0;
              return `
                <button data-action="filter-stage" data-stage="${stage}" class="w-full flex items-center gap-3 group">
                  <div class="w-24 text-xs text-slate-600 shrink-0 text-left">${stage}</div>
                  <div class="flex-1 bg-slate-100 rounded-md h-7 overflow-hidden relative">
                    <div class="h-full bg-emerald-500 group-hover:bg-emerald-600 transition-all" style="width: ${pct}%"></div>
                    <div class="absolute inset-0 flex items-center justify-between px-2 text-xs font-semibold">
                      <span class="${count > 0 ? 'text-white' : 'text-slate-400'}">${count}</span>
                      <span class="${count > 0 ? 'text-white/80' : 'text-slate-400'}">${stagePct}%</span>
                    </div>
                  </div>
                </button>`;
            }).join('')}
          </div>
        </section>

        <section class="bg-white rounded-xl border border-slate-200 p-5">
          <div class="flex items-baseline justify-between mb-3">
            <h3 class="text-sm font-semibold text-slate-900">Activity · last 14 days</h3>
            <span class="text-[11px] text-slate-500 font-medium">${totalLogs} logs</span>
          </div>
          <div class="flex items-end gap-1 h-20">
            ${days.map(d => {
              const h = (d.count / sparkMax) * 100;
              const isToday = d.date.toDateString() === new Date().toDateString();
              return `
                <div class="flex-1 flex flex-col items-center justify-end h-full" title="${d.date.toLocaleDateString()} · ${d.count} ${d.count===1?'log':'logs'}">
                  <div class="w-full ${isToday ? 'bg-emerald-600' : 'bg-emerald-400'} rounded-t-sm" style="height: ${Math.max(h, d.count > 0 ? 4 : 1)}%"></div>
                </div>`;
            }).join('')}
          </div>
          <div class="flex justify-between text-[10px] text-slate-400 mt-1">
            <span>${days[0].date.toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span>
            <span>Today</span>
          </div>
        </section>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-5 mb-5">
        ${leadListSectionHTML('Hottest leads', 'Most logs in the last 14 days. Where momentum is.', hottest, 'count14d', 'logs / 14d', 'No activity in the last 14 days yet.')}
        ${leadListSectionHTML('Needs attention', 'Stale (' + STALE_DAYS + '+ days untouched) or no scheduled next step.', needsAttention, null, null, 'Every active lead is fresh and has a next step scheduled.')}
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-5 mb-5">
        <section class="lg:col-span-2 bg-white rounded-xl border border-slate-200 p-5">
          <h3 class="text-sm font-semibold text-slate-900 mb-3">Upcoming scheduled · ${upcoming.length}</h3>
          ${upcoming.length === 0
            ? `<div class="text-xs text-slate-400">Nothing scheduled. Open a lead and use the bottom log bar with a future date to plan ahead.</div>`
            : `<div class="space-y-1">${upcoming.slice(0, 10).map(a => {
                const lead = state.leads.find(l => l.id === a.lead_id);
                return `
                  <button data-action="select-lead" data-id="${a.lead_id}" class="w-full text-left flex gap-3 py-2 px-2 rounded-md hover:bg-slate-50 transition">
                    <span class="text-[10px] uppercase tracking-wide font-semibold text-slate-500 bg-slate-100 px-1.5 py-0.5 rounded shrink-0 mt-0.5 h-5">${KIND_LABELS[a.kind] || 'Note'}</span>
                    <div class="flex-1 min-w-0">
                      <div class="text-sm text-slate-900 truncate">${esc(a.body)}</div>
                      <div class="text-[11px] text-blue-600 font-medium mt-0.5">${fmtDate(a.event_at)}${lead ? ' · ' + esc(lead.name) : ''}</div>
                    </div>
                  </button>`;
              }).join('')}</div>`}
        </section>

        <section class="bg-white rounded-xl border border-slate-200 p-5">
          <h3 class="text-sm font-semibold text-slate-900 mb-3">Recent wins · last 30 days</h3>
          ${recentWins.length === 0
            ? `<div class="text-xs text-slate-400">No deals signed in the last 30 days.</div>`
            : `<div class="space-y-1">${recentWins.map(l => `
                <button data-action="select-lead" data-id="${l.id}" class="w-full text-left p-2 rounded-md hover:bg-slate-50 transition">
                  <div class="text-sm font-medium text-slate-900 truncate">${esc(l.name)}</div>
                  <div class="text-xs text-emerald-600 truncate">Signed ${fmtRelative(l.updated_at)}${l.company ? ' · ' + esc(l.company) : ''}</div>
                </button>`).join('')}</div>`}
        </section>
      </div>

      <section class="bg-white rounded-xl border border-slate-200 p-5 mb-5">
        <h3 class="text-sm font-semibold text-slate-900 mb-3">Recent activity · across all leads</h3>
        ${recentActivity.length === 0
          ? `<div class="text-xs text-slate-400">No activity logged yet.</div>`
          : `<div class="space-y-0.5">${recentActivity.map(a => {
              const lead = state.leads.find(l => l.id === a.lead_id);
              return `
                <button data-action="select-lead" data-id="${a.lead_id}" class="w-full text-left flex gap-3 py-2 px-2 rounded-md hover:bg-slate-50 transition">
                  <span class="text-[10px] uppercase tracking-wide font-semibold text-slate-500 bg-slate-100 px-1.5 py-0.5 rounded shrink-0 mt-0.5 h-5">${KIND_LABELS[a.kind] || 'Note'}</span>
                  <div class="flex-1 min-w-0">
                    <div class="text-sm text-slate-900 truncate">${esc(a.body)}</div>
                    <div class="text-[11px] text-slate-400 mt-0.5">${fmtDate(a.event_at)}${lead ? ' · ' + esc(lead.name) : ''}</div>
                  </div>
                </button>`;
            }).join('')}</div>`}
      </section>

      <section class="bg-white rounded-xl border border-slate-200 p-5">
        <h3 class="text-sm font-semibold text-slate-900 mb-3">Open todos · ${state.allTodos.length}</h3>
        ${state.allTodos.length === 0
          ? `<div class="text-xs text-slate-400">No open todos. You're caught up.</div>`
          : `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-6 gap-y-1">
              ${Object.entries(todosByLead).map(([leadId, todos]) => {
                const lead = state.leads.find(l => l.id === leadId);
                if (!lead) return '';
                return `
                  <div class="py-2 border-b border-slate-100">
                    <button data-action="select-lead" data-id="${leadId}" class="text-xs font-semibold text-slate-700 hover:text-slate-900 mb-1 block">${esc(lead.name)} <span class="text-slate-400 font-normal">· ${esc(lead.stage)}</span></button>
                    ${todos.map(t => `
                      <div class="flex items-start gap-2 py-1">
                        <input type="checkbox" data-action="toggle-todo-overview" data-id="${t.id}" class="mt-0.5 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500" />
                        <span class="text-sm text-slate-700 break-words">${esc(t.body)}</span>
                      </div>`).join('')}
                  </div>`;
              }).join('')}
            </div>`}
      </section>
    </div>`;
}

function leadListSectionHTML(title, subtitle, leads, metricKey, metricLabel, emptyText) {
  return `
    <section class="bg-white rounded-xl border border-slate-200 p-5">
      <h3 class="text-sm font-semibold text-slate-900">${title}</h3>
      <p class="text-[11px] text-slate-400 mb-3">${subtitle}</p>
      ${leads.length === 0
        ? `<div class="text-xs text-slate-400">${emptyText}</div>`
        : `<div class="space-y-0.5">${leads.map(l => leadRowHTML(l, metricKey, metricLabel)).join('')}</div>`}
    </section>`;
}

function leadRowHTML(l, metricKey, metricLabel) {
  const stageIdx = stageIndex(l.stage);
  const stageDots = STAGES.map((_, i) => `<span class="h-1 w-3 rounded-full ${i <= stageIdx ? 'bg-emerald-500' : 'bg-slate-200'}"></span>`).join('');
  const metric = metricKey
    ? `<span class="text-xs font-semibold ${l[metricKey] > 0 ? 'text-emerald-600' : 'text-slate-400'} shrink-0 ml-2">${l[metricKey]} ${metricLabel}</span>`
    : '';
  const todosBadge = l.openTodos > 0 ? `<span class="text-[10px] text-slate-500 bg-slate-100 px-1.5 py-0.5 rounded ml-2 shrink-0">${l.openTodos} todo${l.openTodos===1?'':'s'}</span>` : '';
  return `
    <button data-action="select-lead" data-id="${l.id}" class="w-full text-left p-2 rounded-md hover:bg-slate-50 transition">
      <div class="flex items-center justify-between gap-2">
        <div class="min-w-0 flex-1">
          <div class="flex items-center gap-2">
            <span class="text-sm font-medium text-slate-900 truncate">${esc(l.name)}</span>
            ${todosBadge}
          </div>
          <div class="text-xs text-slate-500 truncate">${esc(l.stage)}${l.company ? ' · ' + esc(l.company) : ''}</div>
        </div>
        ${metric}
      </div>
      <div class="flex items-center gap-1 mt-1.5">
        ${stageDots}
        <span class="text-[10px] text-slate-400 ml-2">last touched ${fmtRelative(l.lastTouched)}</span>
      </div>
    </button>`;
}

function kpiCardHTML(label, value, color = 'slate') {
  const colorMap = { slate: 'text-slate-900', emerald: 'text-emerald-600', blue: 'text-blue-600' };
  return `
    <div class="bg-white border border-slate-200 rounded-xl p-4">
      <div class="text-[11px] uppercase tracking-wide text-slate-500">${label}</div>
      <div class="text-2xl font-bold ${colorMap[color]} mt-1">${value}</div>
    </div>`;
}

// ─── Actions ─────────────────────────────────────────────────────────────
async function onClick(e) {
  const target = e.target.closest('[data-action]');
  if (!target) return;
  const action = target.dataset.action;
  const id = target.dataset.id;

  switch (action) {
    case 'logout': return sb.auth.signOut();
    case 'add-lead': return addLead();
    case 'select-lead': return selectLead(id);
    case 'go-home': state.selectedId = null; renderSidebar(); renderMain(); return;
    case 'filter-stage':
      state.filter = target.dataset.stage;
      state.selectedId = null;
      renderSidebar();
      renderMain();
      return;
    case 'edit-header': state.editingHeader = true; renderMain(); return;
    case 'cancel-edit': state.editingHeader = false; renderMain(); return;
    case 'set-stage': return setStage(target.dataset.stage);
    case 'delete-lead': return deleteLead();
    case 'toggle-todo': return toggleTodo(id, target.checked);
    case 'toggle-todo-overview': return toggleTodoOverview(id, target.checked);
    case 'toggle-master-todo': return toggleMasterTodo(id, target.checked);
    case 'delete-todo': return deleteTodo(id);
    case 'delete-master-todo': return deleteMasterTodo(id);
    case 'delete-activity': return deleteActivity(id);
    case 'mic-toggle': return toggleDictation();
  }
}

async function addMasterTodo(e) {
  e.preventDefault();
  const input = $('#master-todo-input');
  const dueInput = $('#master-todo-due');
  const body = input.value.trim();
  if (!body) return;
  const due_at = dueInput?.value ? new Date(dueInput.value + 'T17:00').toISOString() : null;
  const { data, error } = await sb.from('todos')
    .insert({ lead_id: null, owner_id: state.user.id, body, due_at })
    .select().single();
  if (error) return toast(error.message, true);
  state.masterTodos.push(data);
  input.value = '';
  if (dueInput) dueInput.value = '';
  renderOverview();
}

async function toggleMasterTodo(id, done) {
  const t = state.masterTodos.find(x => x.id === id);
  if (!t) return;
  const EXCLUDE = new Set(['sípos lóránt', 'vidák lászló']);
  const targets = done
    ? state.leads.filter(l => l.stage !== 'Signed' && !EXCLUDE.has((l.name || '').toLowerCase()))
    : [];

  if (done && targets.length > 0) {
    const ok = confirm(`Mark "${t.body}" as done and log it as a touchpoint on all ${targets.length} active leads?`);
    if (!ok) {
      // revert checkbox UI
      renderOverview();
      return;
    }
  }

  t.done = done;
  const { error } = await sb.from('todos').update({ done }).eq('id', id);
  if (error) return toast(error.message, true);

  if (done && targets.length > 0) {
    const kind = inferKind(t.body);
    const stamp = new Date().toISOString();
    const rows = targets.map(l => ({
      lead_id: l.id,
      owner_id: state.user.id,
      kind,
      body: t.body,
      event_at: stamp,
    }));
    const { data, error: e2 } = await sb.from('activity_log').insert(rows).select();
    if (e2) toast('Master logged but per-lead entries failed: ' + e2.message, true);
    else {
      state.allActivity.unshift(...(data || []));
      // bump leads' updated_at locally so sort is fresh
      targets.forEach(l => { l.updated_at = stamp; });
      computeLastEventCache();
      // persist updated_at bump
      await sb.from('leads').update({ updated_at: stamp }).in('id', targets.map(l => l.id));
      toast(`Logged on ${targets.length} active leads`);
    }
  }
  renderOverview();
}

async function deleteMasterTodo(id) {
  state.masterTodos = state.masterTodos.filter(t => t.id !== id);
  const { error } = await sb.from('todos').delete().eq('id', id);
  if (error) toast(error.message, true);
  renderOverview();
}

// Voice dictation into the bottom log bar.
let dictation = null;
function toggleDictation() {
  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Rec) return toast('Voice not supported in this browser. Try Chrome or iOS Safari.', true);
  const btn = $('#log-mic');
  const input = $('#log-input');
  if (dictation) { dictation.stop(); dictation = null; btn?.classList.remove('bg-red-600','text-white'); return; }
  dictation = new Rec();
  dictation.lang = navigator.language || 'en-US';
  dictation.continuous = false;
  dictation.interimResults = true;
  let baseline = input.value;
  dictation.onresult = (e) => {
    const transcript = Array.from(e.results).map(r => r[0].transcript).join('');
    input.value = (baseline ? baseline + ' ' : '') + transcript;
  };
  dictation.onend = () => { dictation = null; btn?.classList.remove('bg-red-600','text-white'); input.focus(); };
  dictation.onerror = (e) => { toast('Voice error: ' + e.error, true); dictation = null; btn?.classList.remove('bg-red-600','text-white'); };
  dictation.start();
  btn?.classList.add('bg-red-600','text-white');
  toast('Listening… tap mic again to stop');
}

async function toggleTodoOverview(id, done) {
  const todo = state.allTodos.find(t => t.id === id);
  const { error } = await sb.from('todos').update({ done }).eq('id', id);
  if (error) return toast(error.message, true);
  state.allTodos = state.allTodos.filter(t => t.id !== id);
  if (done && todo) await logTodoCompletion(todo);
  renderOverview();
}

async function logTodoCompletion(todo) {
  const row = {
    lead_id: todo.lead_id,
    owner_id: state.user.id,
    kind: 'note',
    body: 'Done: ' + todo.body,
    event_at: new Date().toISOString(),
  };
  const { data, error } = await sb.from('activity_log').insert(row).select().single();
  if (error) { toast(error.message, true); return; }
  state.allActivity.unshift(data);
  if (state.selectedId === todo.lead_id) state.activity.unshift(data);
  computeLastEventCache();
}

document.body.addEventListener('submit', (e) => {
  if (e.target.id === 'header-form') { e.preventDefault(); saveHeader(e); }
  if (e.target.id === 'master-todo-form') { addMasterTodo(e); }
});

async function addLead() {
  const name = prompt('New lead name?');
  if (!name || !name.trim()) return;
  const company = prompt('Company (optional)?') || null;
  const { data, error } = await sb.from('leads')
    .insert({ name: name.trim(), company: company?.trim() || null, owner_id: state.user.id })
    .select().single();
  if (error) return toast(error.message, true);
  state.leads.unshift(data);
  await selectLead(data.id);
}

async function selectLead(id) {
  state.selectedId = id;
  state.editingHeader = false;
  renderSidebar();
  await loadLeadDetail(id);
  renderMain();
}

async function setStage(stage) {
  const id = state.selectedId;
  const now = new Date().toISOString();
  const { error } = await sb.from('leads').update({ stage, updated_at: now }).eq('id', id);
  if (error) return toast(error.message, true);
  const lead = state.leads.find(l => l.id === id);
  if (lead) { lead.stage = stage; lead.updated_at = now; }
  state.leads.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
  renderSidebar();
  renderMain();
  toast(`Moved to ${stage}`);
}

async function saveHeader(e) {
  e.preventDefault?.();
  const f = $('#header-form');
  const payload = {
    name: f.name.value.trim(),
    company: f.company.value.trim() || null,
    email: f.email.value.trim() || null,
    phone: f.phone.value.trim() || null,
    updated_at: new Date().toISOString()
  };
  if (!payload.name) return toast('Name required', true);
  const { error } = await sb.from('leads').update(payload).eq('id', state.selectedId);
  if (error) return toast(error.message, true);
  const lead = state.leads.find(l => l.id === state.selectedId);
  Object.assign(lead, payload);
  state.editingHeader = false;
  renderSidebar();
  renderMain();
}

async function deleteLead() {
  if (!confirm('Delete this lead and all its activity?')) return;
  const id = state.selectedId;
  const { error } = await sb.from('leads').delete().eq('id', id);
  if (error) return toast(error.message, true);
  state.leads = state.leads.filter(l => l.id !== id);
  state.allActivity = state.allActivity.filter(a => a.lead_id !== id);
  state.allTodos = state.allTodos.filter(t => t.lead_id !== id);
  delete state.lastEventByLead?.[id];
  state.selectedId = null;
  state.editingHeader = false;
  renderSidebar();
  renderMain();
  toast('Lead deleted');
}

// Try to match the typed text to a lead by name, company, or known contact.
// Returns { lead, matchedTerm } or null.
function autoRouteLead(text) {
  const t = ' ' + text.toLowerCase() + ' ';
  let best = null;
  for (const l of state.leads) {
    const candidates = [l.name, l.company].filter(Boolean);
    for (const c of candidates) {
      const k = c.toLowerCase();
      if (k.length >= 3 && t.includes(' ' + k) || t.includes(k)) {
        if (!best || k.length > best.matchedTerm.length) best = { lead: l, matchedTerm: c };
      }
    }
  }
  if (best) return best;
  for (const [name, leadId] of Object.entries(state.contactMap)) {
    if (t.includes(' ' + name + ' ') || t.includes(' ' + name + ',') || t.includes(' ' + name + '.')) {
      const lead = state.leads.find(l => l.id === leadId);
      if (lead) return { lead, matchedTerm: name };
    }
  }
  return null;
}

async function onLogSubmit(e) {
  e.preventDefault();
  const input = $('#log-input');
  const body = input.value.trim();
  if (!body) return toast('Type something to log first', true);

  // Smart routing: try to find the lead from the text first; fall back to current selection.
  const routed = autoRouteLead(body);
  const targetLeadId = routed?.lead.id || state.selectedId;
  if (!targetLeadId) {
    return toast('Mention a lead by name (e.g. "MotorEasy demo done") or open a lead first', true);
  }

  const whenInput = $('#log-when').value;
  const event_at = whenInput ? new Date(whenInput).toISOString() : new Date().toISOString();
  const kind = inferKind(body);
  const { data, error } = await sb.from('activity_log')
    .insert({ lead_id: targetLeadId, owner_id: state.user.id, body, kind, event_at })
    .select().single();
  if (error) return toast(error.message, true);
  if (targetLeadId === state.selectedId) state.activity.unshift(data);
  state.allActivity.unshift(data);
  computeLastEventCache();
  input.value = '';
  $('#log-when').value = nowLocal();
  const lead = state.leads.find(l => l.id === targetLeadId);
  const stamp = new Date().toISOString();
  if (lead) lead.updated_at = stamp;
  await sb.from('leads').update({ updated_at: stamp }).eq('id', targetLeadId);
  renderSidebar();
  if ($('#activity-list') && targetLeadId === state.selectedId) $('#activity-list').innerHTML = activityHTML();
  if (!state.selectedId) renderOverview();

  const verb = new Date(event_at) > new Date() ? 'Scheduled' : 'Logged';
  if (routed && routed.lead.id !== state.selectedId) {
    toast(`${verb} on ${routed.lead.name} (matched "${routed.matchedTerm}")`);
  } else {
    toast(verb);
  }
}

async function onTodoSubmit(e) {
  e.preventDefault();
  const input = $('#todo-input');
  const dueInput = $('#todo-due');
  const body = input.value.trim();
  if (!body || !state.selectedId) return;
  const due_at = dueInput?.value ? new Date(dueInput.value + 'T17:00').toISOString() : null;
  const { data, error } = await sb.from('todos')
    .insert({ lead_id: state.selectedId, owner_id: state.user.id, body, due_at })
    .select().single();
  if (error) return toast(error.message, true);
  state.todos.push(data);
  input.value = '';
  if (dueInput) dueInput.value = '';
  $('#todo-list').innerHTML = todosHTML();
}

async function toggleTodo(id, done) {
  const t = state.todos.find(t => t.id === id);
  if (t) t.done = done;
  $('#todo-list').innerHTML = todosHTML();
  const { error } = await sb.from('todos').update({ done }).eq('id', id);
  if (error) return toast(error.message, true);
  if (done && t) {
    await logTodoCompletion(t);
    if ($('#activity-list')) $('#activity-list').innerHTML = activityHTML();
    renderSidebar();
  }
}

async function deleteTodo(id) {
  state.todos = state.todos.filter(t => t.id !== id);
  $('#todo-list').innerHTML = todosHTML();
  const { error } = await sb.from('todos').delete().eq('id', id);
  if (error) toast(error.message, true);
}

async function deleteActivity(id) {
  if (!confirm('Delete this log entry?')) return;
  state.activity = state.activity.filter(a => a.id !== id);
  state.allActivity = state.allActivity.filter(a => a.id !== id);
  computeLastEventCache();
  $('#activity-list').innerHTML = activityHTML();
  const { error } = await sb.from('activity_log').delete().eq('id', id);
  if (error) toast(error.message, true);
  renderSidebar();
}

async function onNotesBlur(e) {
  const notes = e.target.value;
  const { error } = await sb.from('leads').update({ notes }).eq('id', state.selectedId);
  if (error) { toast(error.message, true); return; }
  const lead = state.leads.find(l => l.id === state.selectedId);
  if (lead) lead.notes = notes;
  $('#notes-status').textContent = 'saved';
  setTimeout(() => { if ($('#notes-status')) $('#notes-status').textContent = ''; }, 1500);
}

// Boot
init();
</script>
